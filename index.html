<!DOCTYPE html>
<html>
<head>
  <title>Creating and Removing Elements</title>
</head>
<body>

  <button id="addBtn">Add Paragraph</button>
  <button id="removeBtn">Remove Last Paragraph</button>

  <div id="container"></div>

  <script>
    const container = document.getElementById("container");
    const addBtn = document.getElementById("addBtn");
    const removeBtn = document.getElementById("removeBtn");

    // Add Paragraph
    addBtn.addEventListener("click", function () {
      const p = document.createElement("p");
      p.textContent = "This is a new paragraph.";
      container.appendChild(p); // add to div
    });

    // Remove Last Paragraph
    removeBtn.addEventListener("click", function () {
      if (container.lastChild) {
        container.removeChild(container.lastChild); // remove last child
      }
    });
  </script>

</body>
</html>
