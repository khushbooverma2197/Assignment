<!DOCTYPE html>
<html>
<head>
  <title>Save and Load User Notes</title>
</head>
<body>

  <h2>User Notes</h2>

  <textarea id="notes" rows="8" cols="40" placeholder="Write your notes here..."></textarea>
  <br><br>

  <button id="saveBtn">Save Notes</button>
  <button id="loadBtn">Load Notes</button>
  <button id="clearBtn">Clear Notes</button>

  <script>
    const notes = document.getElementById("notes");
    const saveBtn = document.getElementById("saveBtn");
    const loadBtn = document.getElementById("loadBtn");
    const clearBtn = document.getElementById("clearBtn");

    // Load notes automatically on page load
    window.onload = function () {
      let savedNotes = localStorage.getItem("userNotes");
      if (savedNotes) {
        notes.value = savedNotes;
      }
    };

    // Save Notes
    saveBtn.addEventListener("click", function () {
      let text = notes.value.trim();

      if (text === "") {
        alert("Cannot save empty notes!");
        return;
      }

      localStorage.setItem("userNotes", text);
      alert("Notes saved!");
    });

    // Load Notes when button clicked
    loadBtn.addEventListener("click", function () {
      let savedNotes = localStorage.getItem("userNotes");

      if (savedNotes) {
        notes.value = savedNotes;
      } else {
        alert("No saved notes found.");
      }
    });

    // Clear Notes
    clearBtn.addEventListener("click", function () {
      localStorage.removeItem("userNotes");
      notes.value = "";
      alert("Notes cleared!");
    });
  </script>

</body>
</html>
